<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --text: #0f0f0f;
        --text-2: #606060;
        --bg: #fff;
        --line: rgba(0, 0, 0, 0.1);
        --chip: rgba(0, 0, 0, 0.05);
        --accent: #0f0f0f;
        --on-accent: #fff;
        --error: #cc0000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f1f1f1;
          --text-2: #aaa;
          --bg: #212121;
          --line: rgba(255, 255, 255, 0.12);
          --chip: rgba(255, 255, 255, 0.08);
          --accent: #f1f1f1;
          --on-accent: #0f0f0f;
          --error: #ff6b6b;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 14px/20px Roboto, system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
      header img { width: 28px; height: 28px; }
      h1 { margin: 0; font-size: 16px; font-weight: 600; }
      #summary { margin-bottom: 12px; }
      #count { display: block; font-size: 28px; line-height: 34px; font-weight: 700; }
      #status { color: var(--text-2); font-size: 13px; }
      #status.error { color: var(--error); white-space: pre-wrap; }
      button {
        width: 100%;
        height: 36px;
        font: inherit;
        font-weight: 500;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        color: var(--on-accent);
        background: var(--accent);
      }
      button:hover { opacity: 0.85; }
      button:disabled { opacity: 0.5; cursor: default; }
      ul { list-style: none; margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
      ul:empty { display: none; }
      li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
      li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li .n {
        flex: none;
        min-width: 28px;
        padding: 0 8px;
        border-radius: 10px;
        text-align: center;
        font-size: 12px;
        font-weight: 500;
        background: var(--chip);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" alt="" />
      <h1>Backlog Zero</h1>
    </header>
    <div id="summary">
      <span id="count"></span>
      <span id="status"></span>
    </div>
    <button id="sync">Sync from YouTube</button>
    <ul id="list"></ul>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
