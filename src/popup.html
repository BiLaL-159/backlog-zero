<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 320px; font: 14px system-ui, sans-serif; padding: 12px; }
      h3 { margin: 0 0 8px; }
      button { font: inherit; padding: 8px 12px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; }
      ul { padding-left: 18px; margin: 12px 0 0; }
      li { margin: 2px 0; }
      .muted { color: #666; }
      .error { color: #c00; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h3>Backlog Zero</h3>
    <button id="signin">Sign in &amp; fetch playlists</button>
    <div id="status" class="muted" style="margin-top: 8px"></div>
    <ul id="list"></ul>
    <script type="module" src="popup.js"></script>
  </body>
</html>
